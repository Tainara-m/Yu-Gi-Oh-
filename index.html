<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo de Joken Pô com cartas de Yu-Gi-Oh!">
    <meta name="keywords" content="Yu-Gi-Oh!, Joken Pô, jogo, cartas, HTML, CSS, JavaScript">
    <meta name="author" content="Tainara Martins">
    <title>Yu-Gi-Oh! Joken Pô Edition</title>
    <link rel="stylesheet" href="src/styles/buttons.css">
    <link rel="stylesheet" href="src/styles/containers_and_frames.css">
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/reset.css">
    <link rel="shortcut icon" href="src/assets/favicon/Favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="bg-video">
        <video class="video" autoplay muted loop>
            <source src="./src/assets/video/yugi.mp4" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>
    <div class="container">
        <div class="container__left framed-golden-2">
            <div class="score-box frame">
                <span id="score-points"> Win:0 | Lose:0</span>
            </div>
            <div class="menu-avatar">
                <img  id="card-image">
            </div>
            <div class="card_details frame">
                <p id="card-name">Selecione</p>
                <div id="card-type">uma carta</div>
            </div>
        </div>

        <div class="container__right">
            <div class="card-box__container">
            <div class="card-box framed" id="computer-cards"></div>
            <div class="card-versus">
                <div class="versus-top">
                    <div class="card-infield">
                        <img id="player-infield-card" height="180px" width="125px">
                    </div>
                    <img height="100px" src="./src/assets/icons/millenium2.png" alt="">
                    <div class="card-infield">
                        <img id="computer-infield-card" height="180px" width="125px">
                    </div>
                </div>
                <div class="versus-bottom">
                    <button id="next-duel" class="rpgui-button" onclick="resetDuel()">GANHOU</button>
                    <button id="mute-btn" class="rpgui-button" onclick="toggleMute()">🔊 </button>
                </div>
            </div>
            <div class="card-box framed" id="player-cards"></div>
        </div>
        </div>
    </div>
</body>
<script src="src/scripts/engine.js"></script>
</html>
